# Keep the `ihasmail` branch mirroring upstream's releases.
#
# The branch exists to track Coffey-Labs/ihasmail without dragging main
# along: main is where Gilbert lives and diverges on purpose, and the mirror
# is what a future sync can be checked against or merged from. The branch
# advances only when upstream cuts a release tag -- not on every upstream
# commit -- and only by fast-forward, so it is always exactly some upstream
# release and nothing else.
name: Sync upstream releases

on:
  schedule:
    # Once a day. Upstream cuts release tags on merges, so a daily check is
    # well inside their cadence.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# One sync at a time; two runs racing to fast-forward the same branch would
# both push and one would fail for a reason that has nothing to do with the
# code.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ihasmail
          fetch-depth: 0
      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/Coffey-Labs/ihasmail.git
          # Fetched into their own namespace, never refs/tags: this repository
          # carries its own release tags (v2026.9.5-*), and the two mixed
          # together made the newest-upstream-release check pick one of ours.
          git fetch upstream '+refs/tags/*:refs/upstream/tags/*'
      - name: Fast-forward to the newest upstream release
        id: decide
        run: |
          set -euo pipefail
          # Upstream's release tags are the versioned ones (v2026.9.3-pr272);
          # the v2.16.* and stalwart-* tags are older shapes or branches, not
          # releases. Newest by creation date, chosen from the upstream-only
          # namespace fetched above. The tag is peeled with rev-parse because
          # it may be lightweight: for-each-ref's peeled field is only filled
          # for annotated tags, and an empty sha took the merge down with it
          # on 2026-09-06.
          full="$(
            git for-each-ref --sort=-creatordate \
              --format '%(refname)' \
              'refs/upstream/tags/v20[0-9][0-9].*' | head -1
          )"
          if [ -z "$full" ]; then
            echo "No upstream release tag found." >&2
            exit 1
          fi
          tag="${full#refs/upstream/tags/}"
          sha="$(git rev-parse "${full}^{commit}")"
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "Already up to date at ${tag}."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fast-forward only. If someone ever commits on the mirror, this
          # fails loudly instead of rewriting their work.
          git merge --ff-only "$sha"
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Fast-forwarded the mirror to upstream release ${tag}."
      - name: Push the mirror
        if: steps.decide.outputs.new == 'true'
        # GITHUB_TOKEN cannot carry the workflows permission a PAT or App can,
        # so GitHub refuses a push whose commits rewrite .github/workflows.
        # If an upstream release ever changes its own workflows, this fails
        # loudly here and the mirror has to be advanced by hand with a token
        # that holds that scope.
        run: git push origin HEAD:ihasmail
