name: CI
on:
  # The release pre-check: release.yml calls this before it cuts anything, so
  # nothing ships on a red check. There is deliberately no push trigger any
  # more -- per-push verification is the local fast gate (npm run prepush,
  # enforced by the pre-push hook); see AGENTS.md. The one
  # thing that does run on every push is code scanning, which GitHub runs from
  # the repository's settings (default setup) and not from a file here: this
  # workflow stays the release pre-check.
  #
  # One pull_request exception: Dependabot's branches never pass through the
  # local pre-push hook, so its PRs get the check automatically. The job-level
  # guard below means the trigger costs nothing for human PRs (they are still
  # gated by the local hook and by release.yml's call).
  workflow_call:
  pull_request:
  # Lets CI be run by hand against any ref, including a specific commit.
  # Without this there is no way to re-run a check that never started: a run
  # GitHub queues and then orphans -- as it did to every run created during the
  # Actions outage on 2026-08-26 -- can be neither rerun ("already running")
  # nor cancelled ("already completed"), and the workflow has no other trigger
  # to reach for. Useful too for putting a check on a commit that predates a CI
  # change, without pushing an empty commit to move it.
  workflow_dispatch:
jobs:
  build:
    # A human PR does not run here: it has no way through the pre-push hook
    # anyway, and this workflow stays the release pre-check plus Dependabot.
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Reading the repository is the whole of this job: it checks the tree out,
    # runs the checks and smoke-builds the image, and nothing here writes back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: gilbert:ci
          # The phone's bridge is the slow stage. This job runs first (it is the
          # release's pre-check) and caches it under the same scope the release's
          # image build reads, so Janus is compiled once, not three times.
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
