# The CodeQL analysis, run where a release is prepared rather than on every
# push.
#
# It is a 686 MB toolchain and minutes of analysis, which is why it is not in
# the per-push gate (`check:ci`): a gate that cannot run on a fresh clone is not
# a gate. It is called by `release.yml` as part of its pre-check, so nothing is
# cut on an analysis that is not clean, and it can be dispatched by hand or runs
# weekly so a query added upstream surfaces without a release.
#
# There is no local analysis: this workflow is the one place it runs.
# a machine that has the bundle.
name: CodeQL

on:
  # Called by release.yml's pre-check, beside ci.yml.
  workflow_call:
  workflow_dispatch: {}
  schedule:
    # Weekly, off the hour.
    - cron: "41 3 * * 1"

# Read-only. The analysis reads the run for status and does not publish its
# SARIF (this repository is private without GitHub Code Security), so no write
# permission is asked for. `security-events: read` is the CodeQL Action's own
# API -- its telemetry endpoint and experimental opt-in -- and is what keeps the
# action from warning that it cannot reach it; reading, like the rest.
permissions:
  contents: read
  actions: read
  # The analysis stores its result where the repository's code scanning reads
  # it. This is the workflow's own ceiling, and a caller can only lower it: a
  # `read` here made the CodeQL Action retry an upload it was not allowed to
  # make, and the run still said success with nothing stored.
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # JavaScript and TypeScript need no build step for the extractor, which
      # also reads the GitHub Actions workflows through this suite.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
          # The SARIF is not published: this is a private repository without
          # GitHub Code Security, so code scanning cannot receive it. The
          # analysis still runs, and the next step holds the gate.
          upload: never
      # What publishing would have done: an alert the repository cannot see is
      # no less an alert. Any result fails the job.
      # fails locally, so a release is still never cut on an unclean analysis.
      - name: Fail on any analysis result
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ steps.analyze.outputs.sarif-output }}"
          if ! find "$dir" -name '*.sarif' -type f -print -quit | grep -q .; then
            echo "CodeQL wrote no SARIF under $dir"
            exit 1
          fi
          count="$(find "$dir" -name '*.sarif' -type f -exec cat {} + \
            | jq -s '[.[].runs[] | (.results // [])[]] | length')"
          echo "CodeQL: $count result(s)."
          if [ "$count" -gt 0 ]; then
            find "$dir" -name '*.sarif' -type f -exec cat {} + \
              | jq -r '.runs[] | (.results // [])[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
              | sort -u
            exit 1
          fi
