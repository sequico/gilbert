# Gilbert's hardening, layered over gilbert.service (install/install.sh).
#
# A drop-in, so a deployment's own unit stays the unit — its ExecStart, its
# User, its paths — and this adds policy only. The app binds one port, reads its
# checkout and reads its environment file, and writes nothing durable (state and
# sessions live in Stalwart), so the filesystem is made read-only to it except
# its private /tmp and, when a deployment mounts one, /data.
[Service]
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=full
# Read-only rather than hidden: the checkout may live under /home.
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
