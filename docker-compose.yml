services:
  gilbert:
    build:
      context: .
      args:
        # Passed to the build as well as the run because the web bundle writes
        # its own asset URLs: a build that does not know the prefix produces an
        # app that cannot load itself under one. Empty is the domain root.
        BASE_PATH: ${BASE_PATH:-}
    image: gilbert:2
    restart: unless-stopped
    # Loopback only: Gilbert expects a TLS reverse proxy in front of it. On
    # every interface the app is reachable over plain HTTP, passwords and all,
    # and with TRUST_PROXY any machine on a private network can set its own
    # X-Forwarded-For. A proxy running in Docker reaches the service by name on
    # the compose network and needs no published port at all.
    ports:
      - "127.0.0.1:8080:8080"
    # The app needs no privileges and, with IMMUTABLE set, writes nowhere: the
    # whole of its state lives in Stalwart.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # The handshake: the one thing this container has to be told. Where
      # Stalwart is, and the installation's own account -- the Master -- it signs
      # in as. Everything else the installation decides lives in its own
      # document, in Stalwart -- the app name, the proxy posture, the rate
      # limits, the live-update mode -- and is published from Administration >
      # Installation.
      STALWART_URL: ${STALWART_URL:?set STALWART_URL in .env}
      GILBERT_AGENT_ADDRESS: ${GILBERT_AGENT_ADDRESS:-}
      GILBERT_AGENT_PASSWORD: ${GILBERT_AGENT_PASSWORD:-}
      # The container's own facts, and the facts about the image rather than
      # the installation: what it serves, and where its source can be had.
      IMMUTABLE: "1"
      BASE_PATH: ${BASE_PATH:-}
      # Left unset, the server's own default stands (`.env.example` names it).
      SOURCE_URL: ${SOURCE_URL:-}
      # The operator's own statement: may the installation's model reach a model
      # endpoint inside this network. Not the installation's to decide (ADR 0027).
      GILBERT_AGENT_ALLOW_PRIVATE_PROVIDER: ${GILBERT_AGENT_ALLOW_PRIVATE_PROVIDER:-}

