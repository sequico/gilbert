services:
  gilbert:
    build:
      context: .
      args:
        # Passed to the build as well as the run because the web bundle writes
        # its own asset URLs: a build that does not know the prefix produces an
        # app that cannot load itself under one. Empty is the domain root.
        BASE_PATH: ${BASE_PATH:-}
    image: gilbert:2
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      STALWART_URL: ${STALWART_URL:?set STALWART_URL in .env}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (openssl rand -base64 48)}
      APP_NAME: ${APP_NAME:-Gilbert}
      BASE_PATH: ${BASE_PATH:-}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/sequico/gilbert}
      TRUST_PROXY: "1"
      IMAGE_PROXY: "1"
      # Live updates. Unset keeps every account on the per-tab relay, which is
      # what Gilbert does without it -- see .env.example.
      PUSH_MODE: ${PUSH_MODE:-}
    volumes:
      - gilbert-data:/data
  # The agent worker: the same image, a second process, no port and no
  # writable path of its own -- everything it knows lives in Stalwart, so a
  # replacement picks the work up from the documents (ADR 0003). Start it with
  #   docker compose --profile agent up
  # and stop it by leaving the profile out.
  #
  # The pair is read from the environment and is not required to bring the stack
  # up: the server service above starts without it, and Admin > Agents names the
  # state (`agent_not_configured`) beside how to set the two. The worker is the
  # one process that stops -- with nothing to serve it exits naming both
  # variables rather than starting half-configured, so leaving the profile out
  # is how a deployment runs with no agent at all.
  gilbert-agent:
    profiles: ["agent"]
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-}
    image: gilbert:2
    restart: unless-stopped
    command: ["node", "server/dist/agent/worker.js"]
    environment:
      STALWART_URL: ${STALWART_URL:?set STALWART_URL in .env}
      GILBERT_AGENT_ADDRESS: ${GILBERT_AGENT_ADDRESS:-}
      GILBERT_AGENT_PASSWORD: ${GILBERT_AGENT_PASSWORD:-}
      GILBERT_AGENT_AREAS: ${GILBERT_AGENT_AREAS:-}
      GILBERT_AGENT_HEALTH_PORT: "8081"
      IMMUTABLE: "1"
      SESSION_FILE: ""
    # What the restart policy asks: is this worker serving what it claimed.
    # `restart: unless-stopped` restarts a dead process; this catches one that
    # is up and holding nothing.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gilbert-data:
